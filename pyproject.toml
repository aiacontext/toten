[project]
name = "toten"
version = "0.1.0"
description = "Knowledge-based ontological tokenization of physical quantities and technical notation in Brazilian Portuguese"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Antonio de Sousa Leitão Filho", email = "antonio@aiacontext.com" },
]
keywords = [
    "tokenization",
    "ontology",
    "engineering",
    "physical-quantities",
    "llm",
    "hallucination",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "regex>=2024.0.0",
    "lark>=1.2.0",
    "numpy>=2.0.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "nltk>=3.9.4",
]

[project.optional-dependencies]
# Regerar os oráculos a partir do Pint (scripts/build_*.py). Em uso normal os
# oráculos já vêm prontos em data/ — esta extra só é necessária para reconstruí-los.
buildtime = [
    "pint>=0.24",
    "sentencepiece>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/aiacontext/toten"
Repository = "https://github.com/aiacontext/toten"

[dependency-groups]
dev = [
    "pint>=0.25.3",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toten"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "N", "C4", "SIM",
]
ignore = []
